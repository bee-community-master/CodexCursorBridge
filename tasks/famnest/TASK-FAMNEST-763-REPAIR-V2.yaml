non_goals:
  - Do not replace the authoritative credit ledger, metering, billing entitlement, native purchase,
    notification delivery, or AI job lifecycle with a parallel in-memory or UI-only authority.
  - Do not give Web a checkout capability; Web only explains native purchase and links to an
    official native store surface.
  - Do not expose exact balance, expiry, price, purchase history, private AI usage, member or child
    attribution, raw prompt/output, provider ID, provider dispatch reference, plan title, or private
    plan existence to child/caregiver projections, telemetry, push payloads, or public errors.
  - Do not change production store products, provider consoles, live billing or push delivery,
    production resources, credentials, deployment configuration, or external consoles.
  - Do not accept focused or in-memory tests as substitutes for freshly migrated PostgreSQL RLS,
    restart, contention, and durable persistence evidence.
acceptance_criteria:
  - Balance and transaction reads use authoritative PostgreSQL state. Parent full view returns exact
    available/reserved/next-expiry, entitlement, actor-aware can_purchase, and durable
    balance_revision; child/caregiver availability_only contains only is_available,
    can_request_parent, and balance_revision. Application authorization and migrated RLS deny exact
    credit rows and transaction/history reads to child, caregiver, inactive, unrelated, and
    cross-family actors rather than loading exact data and redacting it afterward.
  - "Parent transaction history is real cursor pagination ordered occurred_at DESC then
    ledger_event_id DESC with default 50, max 100, #768 invalid_cursor 422, signed integer
    centi-credits, bounded display reason/status, and exact category enum. private_ai_usage is
    derived and durably stored from the provider-dispatch reference classification while provider
    reference, source filename, prompt/output, plan title, and member/child attribution remain
    content-free and absent from every projection, audit, metric, push, and client fixture."
  - "Insufficient-credit handling re-reads current PostgreSQL balance exactly once and retries
    reserve exactly once before provider dispatch. It preserves balance_revision and an opaque
    durable resume_token across error boundaries, restart, and replay. First-stage recovery and
    OCR-success-to-LLM resume are idempotent: retry, double tap, crash, and concurrent workers do
    not duplicate provider dispatch, reserve, settle, release, ledger event, or resume, and child or
    caregiver errors disclose neither exact amount nor stage detail."
  - The 70, 90, and 100 percent recurring-grant thresholds and total-balance-zero event are invoked
    from a production ledger/application/worker hook, not only a planner test. Top-up-only lots emit
    no expiry threshold. A durable PostgreSQL uniqueness/claim contract dedupes by family, billing
    period, lot/event and threshold across restart, replay, and concurrent workers. Only an
    internal-worker-authorized path may insert/claim events, migrated RLS rejects public writes,
    targets are active parents only, and delivered push payloads contain only sync_needed,
    projection revision hint, and opaque event ID.
  - Web uses the real generated API client and repository for balance and parent cursor pagination;
    the workspace controller and WorkspaceBillingPanel render role-specific loading, offline
    last-confirmed read-only, stale, zero, insufficient, pending, success, refund, and
    terminal/error states. Formatting is locale-aware but always fixed to exactly two fractional
    digits, including 0, 0.01, 30, 250, and 500. Web purchase controls never initiate checkout.
  - Android performs real transport-to-repository-to-use-case-to-reducer/ViewModel-to-Compose calls
    through production DI. iOS performs real generated
    API-client-to-gateway-to-composition/state-to- SwiftUI calls. Both platforms paginate parent
    history, aggregate categories, retain an offline last-confirmed read-only projection, implement
    first-stage and OCR-to-LLM recovery, and expose native purchase pending/double-tap protection
    while child/caregiver surfaces show only availability and parent-request guidance.
  - Web, Android, and iOS role-specific UI and real API integration tests cover parent, child,
    caregiver, inactive, unrelated, and cross-family behavior; cursor pagination; offline/stale;
    insufficient recovery; transaction/category aggregation; purchase states; and failure
    visibility. Keyboard/focus order, semantic status announcements, VoiceOver/TalkBack labels,
    Dynamic Type or 200-percent font scale, narrow screens, reduced motion, touch targets, and
    disabled/busy states keep amount and CTA perceivable without color alone.
  - The preserved PR remains descended from exact Wave3 base
    7c3f7a7b82b8af1903d09a512906dc1c931c65c4 and contains no unrelated Wave3 issue. Freshly migrated
    PostgreSQL/RLS tests, generated OpenAPI and all platform contracts, focused suites, migration
    validation, and full repository verification pass at the final tree with exact, non-tautological
    assertions and visible failures.
implementation_constraints:
  - "Begin from open draft PR #781 at exact checkpoint a6ae63b9caffca539d4b872899d2efc58563135a.
    Stop if its head moves, it becomes non-draft or closed, its head repository changes, or its
    merge-base with main is not exact Wave3 base 7c3f7a7b82b8af1903d09a512906dc1c931c65c4."
  - "The prior SCOPE_VIOLATION's thirteen paths are legitimate #763 integration and test paths and
    are explicitly authorized above. Preserve the checkpoint and repair forward under this fresh v2
    approval; do not discard, reconstruct, rebase, force-push, or import another issue."
  - Independent review currently has clean streak 0. Prior evidence is limited to 23 focused tests,
    18 Web tests, OpenAPI generation, migration validation, and Android/iOS contract evidence.
    Independent verification did not run; live/fresh migrated PostgreSQL DB and RLS evidence and
    full repository verification are absent. Do not treat those partial passes, skipped DB smoke,
    generated diff failures, or Cursor's summary as completion evidence.
  - Reuse canonical billing, AI-job, notification, repository-context, generated-client, DI,
    transaction, RLS, and worker infrastructure. Keep balance, reservation, resume, category,
    threshold, push, and actor projection decisions server-authoritative and durable; do not trust a
    client role, cached balance, stage, can_purchase flag, category, resume token, or provider
    reference as authority.
  - All credit amounts remain integer centi-credits on the wire and ledger. Conversion is display
    only, and audit, telemetry, error, notification, and provider payloads remain content-free and
    role-safe.
