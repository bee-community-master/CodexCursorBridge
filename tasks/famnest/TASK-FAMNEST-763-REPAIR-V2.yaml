required_new_tests:
  - Add freshly migrated PostgreSQL API and RLS coverage for parent full and transaction access,
    child/caregiver availability-only access without exact-row reads,
    inactive/unrelated/cross-family denial, actor-aware can_purchase, balance_revision persistence,
    and resume_token durability.
  - Add PostgreSQL-path insufficient-credit tests for stale balance re-read once and reserve retry
    once before provider dispatch, restart and concurrent replay, durable OCR-success-to-LLM resume,
    no duplicate ledger/reservation/provider effects, and role-safe error redaction.
  - Add migrated PostgreSQL threshold tests for 70/90/100 recurring grants, no top-up expiry
    thresholds, total-zero once, production hook invocation, active-parent-only targeting,
    internal-worker-only insert/claim and RLS, opaque push delivery, and restart/concurrency dedupe.
  - Add exact private_ai_usage classification and transaction tests proving provider dispatch
    references map to the aggregate category without exposing reference, content, member, child,
    plan, source, or provider attribution through storage, projection, generated clients, fixtures,
    metrics, notifications, or errors.
  - Add Web real-client/repository/controller/WorkspaceBillingPanel tests for cursor pagination,
    category aggregation, fixed two-decimal locale formatting, parent versus child/caregiver UI,
    offline last-confirmed read-only state, every required failure/purchase/refund state,
    native-only purchase guidance, keyboard/focus/status semantics, reduced motion, and narrow
    layout.
  - Add Android transport/repository/use-case/reducer/ViewModel/Compose/DI tests and iOS API-client/
    gateway/composition/state/SwiftUI tests for real calls, pagination, role-safe UI, offline state,
    insufficient first-stage and OCR-to-LLM durable resume, native purchase double-tap prevention,
    category aggregation, error rendering, and platform accessibility semantics.
  - Regenerate and verify OpenAPI and every Web/Android/iOS contract artifact, then run focused,
    migrated PostgreSQL/RLS, migration, architecture, and full repository gates with exact
    assertions for final-tree behavior and failure visibility.
