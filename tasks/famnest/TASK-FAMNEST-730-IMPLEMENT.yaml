  allow_test_deletion: false
  max_repair_attempts: 2
stop_conditions:
  - A requested behavior requires credentials, production deployment, live provider/notification,
    production database mutation, store submission, or device-only evidence.
  - A requested resolver or notification behavior belongs to an out-of-scope issue, provider, or
    production integration rather than this lifecycle contract.
  - Any implementation would weaken high/very_high approval, consent withdrawal, human/source
    protection, privacy, RLS, idempotency, revision, or retention boundaries.
