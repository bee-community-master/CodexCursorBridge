id: TASK-FAMNEST-730-IMPLEMENT
repository: famnest
title: Implement operational-memory trial application review and undo lifecycle
spec_version: 1
goal: "Implement issue #730's two-week operational-memory trial, explicit review and activation,
  material-edit re-consent, fail-closed application pipeline, immutable audit, scheduler retries,
  and bounded undo across backend persistence, OpenAPI, generated Web/iOS/Android contracts, and
  role-safe UI without taking over #753 resolver or #754 notification ownership."
