required_new_tests:
  - Add deterministic clock/timezone/DST backend and migrated-Postgres tests for exact boundaries,
    state transitions, timezone change, expiry, review recommendation, and safety stop behavior.
  - Add material/non-material edit matrix, consent/trial invalidation, human/source protection,
    conflict, idempotency/replay, partial-skip, audit-redaction, RLS, retention, and undo
    TTL/revision tests.
  - Add OpenAPI and Web, Android, and iOS contract/UI tests for every endpoint/status/discriminator,
    role-safe projections, accessibility, offline/stale/error states, and opaque notification
    payloads.
