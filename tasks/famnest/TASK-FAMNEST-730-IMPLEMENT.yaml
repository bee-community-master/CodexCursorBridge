non_goals:
  - Do not implement product-specific resolver adapters owned by later issues or external provider
    integrations outside the operational-memory trial/application lifecycle.
  - Do not trial or auto-apply high or very_high risk actions, and do not turn legacy_unreviewed
    behavior into a new trial before its first material edit.
  - Do not auto-revert human edits, explicit completion/cancel state, latest verified source, or
    agreement conflicts; preserve safe subsets or block with explainable paths.
  - Do not store sensitive memory text, credentials, contacts, provider payloads, or raw
    child/member attribution in application audit, metrics, notifications, or public DTOs.
  - Do not claim production scheduler execution, provider deliverability, live consent effect,
    production migration, device/store readiness, or experiment/product impact from repository
    evidence.
  - Do not modify credentials, deployment configuration, production resources, or external consoles.
acceptance_criteria:
  - Only low family agreements and medium agreement-plus-affected-member-consent automation policy
    revisions can enter a 14-calendar-day trial. High, very_high, and legacy_unreviewed are excluded
    as specified. The lifecycle is awaiting_consent -> trial_scheduled -> trial_active -> review_due
    -> active, with immediate fail-closed pause on consent withdrawal, safety block, source
    invalidation, member leave, or revoke and no rollback merely because periodic review is pending.
  - Trial starts at the next local midnight after the final required consent, uses an exact
    half-open [starts_at, ends_at) 14-calendar-day boundary, snapshots timezone ID, UTC offset,
    local and UTC endpoints, and never moves an existing boundary after DST or family-timezone
    changes. A pre-start timezone change invalidates the reservation and rebooks a new revision with
    an audit reason.
  - At review_due the user must continue, modify, or stop. Continue activates that revision, stop
    pauses it, and material modify invalidates prior consent and restarts consent plus trial. No
    review for 30 calendar days expires the trial and requires a new consent/trial to resume.
    Periodic family fact/agreement-policy review recommendations are emitted at 12/6 months without
    stopping existing application, while fail-closed safety events stop immediately.
  - Material edit detection covers kind/domain/action/resource scope, condition/result/value,
    affected or assigned members, protected subject, risk fields, agreement-policy linkage,
    automation window/frequency/limit, and meaning-changing source. Title/description/microcopy,
    display metadata, and irrelevant typo changes are non-material. The exact field paths and
    decision are version-audited, and material changes invalidate consent, approval, and trial.
  - "Preview/execute/skip/block uses the fixed pipeline of membership and role, memory/policy
    revision, #729 action registry and affected members, human/source/safety protection, agreement
    conflict, dry-run effect and undo capability, idempotent execute, and projection invalidation.
    The operational_memory_applications record stores family, memory/policy/version,
    action/resource, affected members, risk, status, typed before/after diff or safe field mask,
    protection reason, idempotency key, expected/actual revisions, actor, timestamp, and no
    sensitive raw content."
  - Application status is exactly previewed, applied, skipped, blocked, failed, or undone. Human
    edits and completed/canceled state remain protected; safe non-conflicting fields may apply while
    skipped paths and reasons remain explainable, but any active agreement conflict blocks the whole
    action. Retry, replay, stale revision, out-of-order delivery, and partial skip create no
    duplicate side effects or notification records.
  - Reversible low/medium applications require Idempotency-Key and expected_revision for execute and
    undo, default to a 24-hour undo TTL unless the action registry supplies a shorter TTL, compare
    the before revision with current revision, preserve later human edits via safe subset or return
    undo_conflict, and transition to undone exactly once. High/very_high, delete, and purge use
    their bounded-context recovery contracts rather than generic undo.
  - "The APIs expose trial create/get/review and application preview/create/list/get/undo with the
    exact issue paths, generated OpenAPI discriminator/status/error/revision/idempotency shapes, and
    role-safe Web/iOS/Android clients. RLS plus service authorization enforce family membership,
    actor role, affected-member scope, consent source, and cross-family denial; privacy and #768
    retention rules are applied to audit, projections, and deletion/purge behavior."
  - "The runner claims due starts/ends, 30-day expiry, and 6/12-month review from authoritative DB
    timestamps. At-least-once retries use unique transition and dedupe keys, never advance
    boundaries for clock skew or crash replay, and emit notification/projection events only through
    #754 opaque contracts. Web, Android, and iOS render consent, trial, review, paused, expired,
    blocked, applied, and undo-conflict states accessibly without exposing protected memory
    details."
