non_goals:
  - Do not implement the iOS Share Extension or Android intent ingress lifecycle owned by issues 749
    and 750; this repair owns only the shared generated contract and conformance surfaces.
  - Do not replace the existing generic file_upload source type, break legacy single-upload or
    multi-attachment email/URL records, or add a general source type, crawler, or photo watcher.
  - Do not add an in-memory-only outbox, revocation audit, staging authority, OCR barrier, credit
    ledger substitute, or status-only simulation in place of production runtime and PostgreSQL
    wiring.
  - Do not weaken active membership, child scope, submitted-account ownership, object ownership,
    parent-only approval, candidate warning acknowledgement, RLS, idempotency, or retention.
  - Do not store raw bytes, URI, filename, source app, client item ID,
    family/member/child/input/source IDs in telemetry, crash reports, deep links, or push payloads.
  - Do not claim production provider, bucket, notification, migration, device, or store readiness
    from repository-local evidence.
acceptance_criteria:
  - Runtime and API integration are real. Canonical repository contexts carry
    family_child_profile_ids through construction, load, mutation, and persistence, and all fourteen
    shared-image API integration cases pass without the five current 500 responses. Intent,
    complete, refresh, finalize, read, candidate warning acknowledgement, and approval use the same
    authoritative production repository and transaction paths rather than a test-only context.
  - AI orchestration fans out actual OCR work per accepted image or synthesized-PDF page with
    immutable ordinal and source/page-scoped retries. A durable terminal barrier waits for every OCR
    unit, ordered fan-in uses successful extraction by ordinal, all-failure creates no candidate and
    remains retryable, partial failure records missing ordinals and requires parent warning
    acknowledgement, and successful fan-in invokes the LLM and candidate creation exactly once. OCR
    reserve/settle/release and downstream LLM reserve use stable logical/stage/ordinal keys; crash,
    replay, partial failure, and insufficient-credit resume cannot duplicate ledger events or calls.
  - AI dispatch outbox records and sensitive-input owner-revocation audits are durable PostgreSQL
    state with complete collection, row mapping, load, persist, state-sync, and restart behavior.
    Transactional unique keys make finalize replay, worker crash recovery, restart, revocation
    replay, and parent notification creation converge exactly once without losing immutable actor,
    reason, input, affected member, or timestamp audit fields.
  - RLS and application authorization are restrictive rather than a permissive OR layered on legacy
    same-family access. Freshly migrated PostgreSQL tests prove active membership, submitted account
    and object ownership, parent and candidate-owner reads, leave/suspend/delete/account deletion
    revocation, parent sensitive-input revocation, cross-family rejection, and caregiver or
    grandparent child-scope enforcement. The OS-share submitter read exception is limited to active
    owners of their own submitted originals and candidate; approval remains parent-only.
  - Source ordinals are immutable and collision-safe across ingestion surfaces. Shared-image input
    uniqueness and backfill do not apply a global default ordinal zero that breaks existing email or
    URL multi-attachment records. Existing generic single upload and email/URL batches with two or
    more attachments retain stable distinct ordinals across create, load, persist, retry, migration,
    restart, and cleanup while shared-image duplicate SHA handling deterministically preserves the
    canonical source and cleans or revokes the duplicate object without orphaned rows or bytes.
  - The common staging coordinator implements the fixture state machine staging, staged, claimed,
    uploading, awaiting_user_choice or ready_to_finalize, and finalized, cancelled, or expired.
    Claims are atomic single-consume operations; bundles have a 24-hour expiry and idempotent
    cancel, expiry, logout, and account-change cleanup; 1-second and 3-second retry scheduling
    preserves the bundle until the user chooses retry or successful-subset finalize. Limits reject a
    new bundle without deleting existing ones, and crash/restart cannot duplicate claim, upload,
    finalize, or cleanup effects.
  - "Complete-upload idempotency is bound to the full validated payload including byte size, MIME,
    SHA-256, source/input ownership, and object identity: exact replay succeeds, any changed payload
    conflicts, and only one verified canonical source remains. Accepted ordinals, source metadata,
    accepted set/order, finalize outbox, warning acknowledgement, and finalized state are immutable
    after their contract boundary."
  - The four shared-image endpoints and exhaustive request, response, status, idempotency, revision,
    role-safe credit, privacy, signed-URL, staging, and error shapes are present in OpenAPI and the
    generated Web schema, Android path/DTO contracts, iOS API client/DTO contracts, and platform
    conformance fixtures. Main-app telemetry records only received, presented, submitted, and
    candidate_ready with source_surface=os_share and opaque identifiers; extension/receiver emits no
    event and notifications stay in-app and content-free. Existing single upload and email/URL
    multi-attachment flows remain backward compatible.
  - The preserved PR remains descended from exact Wave3 base
    7c3f7a7b82b8af1903d09a512906dc1c931c65c4 and contains no unrelated Wave3 issue. Ruff, all
    fourteen focused API integration tests, AI/domain/staging tests, generated OpenAPI and platform
    contract checks, migrated PostgreSQL and RLS coverage, migrations, and full repository
    verification pass on the final tree with exact non-tautological assertions and failure
    visibility.
