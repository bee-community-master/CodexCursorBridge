required_new_tests:
  - Add production API/repository integration coverage for all fourteen shared-image cases,
    including family_child_profile_ids context construction, intent/complete/refresh/finalize/read,
    exact-payload replay versus conflict, duplicate-SHA cleanup, immutable ordinal/set/order, and
    warning acknowledgement before parent approval.
  - Add actual OCR page/source fan-out, terminal barrier, ordered fan-in, partial and all-failure,
    LLM exactly-once, reserve/settle/release, insufficient-credit resume, crash-before/after commit,
    replay, restart, stable key, and no-duplicate ledger/outbox/candidate/notification tests.
  - Add freshly migrated PostgreSQL and RLS tests for outbox and revocation-audit load/persist/sync,
    restart dedupe, active owner and parent reads, parent-only approval, caregiver child scope,
    cross-family and other-account rejection, and immediate leave/suspend/delete/account-deletion or
    explicit parent-revocation denial.
  - Add regression tests proving generic single upload and existing email/URL batches with two or
    more attachments retain immutable collision-free ordinals across migration, persistence, retry,
    restart, and cleanup, while shared-image canonical duplicate SHA rows and objects converge
    safely.
  - Add staging coordinator tests for limits, staged/claimed atomic single-consume, 24-hour expiry,
    1-second and 3-second retry, explicit retry-versus-successful-subset choice,
    cancel/expiry/logout/ account-change cleanup, restart recovery, and no implicit bundle deletion.
  - Regenerate OpenAPI and add Web generated-schema, Android derived-path/DTO, iOS client/DTO, and
    cross-platform fixture conformance tests for both representations, exhaustive role-safe status
    and errors, payload-bound idempotency, signed URL expiry, staging, privacy, os_share main-app
    telemetry, opaque notifications, and backward-compatible single upload plus email/URL
    two-or-more attachment flows.
  - Run Ruff, the fourteen focused API integration cases, migrated DB/RLS tests, OpenAPI full
    verification, migration verification, and full repository gates. Repair the eight current Ruff
    errors and five current API failures; assertions must prove actual call counts, rows,
    transitions, objects, role filtering, retries, cleanup, generated artifacts, and final failure
    visibility.
