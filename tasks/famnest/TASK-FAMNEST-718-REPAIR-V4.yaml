stop_conditions:
  - A requested behavior requires credentials, production deployment, live provider/calendar,
    production database mutation, store submission, or device-only evidence.
  - A dependency contract is missing or incompatible and would require silently changing a
    parent-owned or earlier-wave contract instead of implementing FamilyTaskV2 within this task.
  - Any implementation would add a parallel task, reminder, ItemFlow, handoff, permission, or memory
    authority.
  - "Draft PR #783 is closed, non-draft, moved from checkpoint
    208f35baec7b0c282195e892488cac30f831bdab before dispatch, changes head repository or
    destination, or cannot be repaired forward without discarding preserved work."
  - submit_bridge_outcome was consumed before all mandatory implementation and tests completed, or
    the Bridge cannot keep a research summary and partial verification non-terminal. Stop with
    truthful evidence; never publish a placeholder success or attempt a second corrective call.
