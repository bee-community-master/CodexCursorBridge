non_goals:
  - Do not create a child-only canonical status store, a second handoff ledger, or a second
    reminder/ItemFlow/evidence authority.
  - Do not allow legacy role/time/core-field writes or generic guarded-child offline auto-rebase;
    retain only compatible reads and offline complete/reopen with strict conflict handling.
  - Do not grant permissions through executor, owner, helper, beneficiary, or choice_scope fields;
    existing MemberPermission, family membership, ACL, and RLS remain authoritative.
  - Do not copy ItemFlow raw content, sensitive provider payloads, reminders, memory text, or
    authorization data into FamilyTask.
  - Do not claim production migration execution, live provider/calendar behavior, device/store
    readiness, or production data effects from repository tests.
  - Do not modify credentials, deployment configuration, production resources, or external consoles.
acceptance_criteria:
  - FamilyTaskV2 persists executor_member_id, optional owner/helper/beneficiary member IDs,
    hard_deadline with local date plus optional local time and timezone, independent planned_window,
    choice_scope, bounded ready/done conditions and required_items, item_flow_ref list,
    execution_context, blocked_reason, immutable origin_lineage, representative_origin, revision,
    projected started_at, canonical task_status, derived execution_state, and is_overdue. Date-only
    deadlines remain date-only and reminders remain in their separate ledger.
  - Role assignment validates same-family membership and resource ACL without adding authority;
    omitted owner defaults to executor; helper and beneficiary lists are bounded and unique; an
    executor who cannot read the resource is rejected. Allowed choice_scope values are exactly
    fixed, time_within_window, order_within_operation, helper_request, and execution_method.
  - "Canonical storage remains open, completed, or deleted. Deleted tasks disappear from Active,
    plan, and Today projections. Execution state is derived in the exact order completed, blocked,
    handoff, not_ready, in_progress, ready, with overdue represented only by is_overdue. start_now
    records a #725 response/audit active marker and server started_at without changing task
    structure or plan_revision; reopening clears the active marker but retains history."
  - Every FamilyTask v2 route, mutation, read projection, repository entry point, migration read,
    and v2-only data exposure is guarded fail-closed by the canonical release/repository capability.
    When unavailable, legacy reads remain backward compatible but no v2 field, marker, audit row, or
    mutation leaks through the legacy public Task record or an unguarded adapter path.
  - blocked_reason uses the fixed typed codes missing_item, waiting_on_person, waiting_on_decision,
    schedule_conflict, external_dependency, not_ready, assignment_mismatch, or other with bounded
    note. Conditions, required items, ItemFlow/evidence/origin references, labels, summaries, and
    mitigation notes enforce the issue bounds, reject duplicate scopes and blank values with 422,
    and reject cycles or dangling dependencies atomically.
  - Handoff extends the existing TaskAssignmentResponse record. Reassignment projects an active
    handoff until the new executor accepts or requests help, and no extra handoff authority is
    created. Origin lineage is immutable after creation; representative_origin is deterministic in
    source_verified, family_agreement, user_added, ai_suggestion order and edits add references
    rather than overwriting provenance.
  - An active reassignment/handoff blocks every conflicting task mutation, including start,
    complete/reopen, role, window/deadline, readiness, blocker, dependency, and visibility changes,
    until the response resolves. The API returns an atomic typed 409 conflict with the latest task
    and operation revisions; replay never partially applies or forks assignment state.
  - The v2 command and read DTOs are generated in OpenAPI and consumed by Web, Android, and iOS.
    assignee_member_id, due_date, and due_time remain read-only compatibility projections. Legacy
    role/time/core-field mutations return unsupported_legacy_mutation; only existing reads and
    offline complete/reopen remain compatible. All v2 mutations require expected_revision and
    Idempotency-Key, while stale updates return 409 plus the latest projection.
  - Offline complete/reopen stores queue-time Task revision as outbox base_revision. Any mismatch
    returns a conflict receipt even when the requested target state already matches, never
    auto-rebases or silently applies, and guarded child reopen is excluded from generic offline
    recovery. Client projections and conflict UI preserve the latest server state and explicit
    retry.
  - The migration is a single strict all-dataset transaction. It deterministically maps legacy
    assignee, owner/helper/beneficiary role, due date/time/timezone, source and immutable lineage
    fields and processes deleted records as well as active records, including every deleted task
    retained inside the seven-day recovery window. It records migration-review audit for invalid
    assignees corrected to the family canonical primary parent, and aborts globally with no changes
    when any affected family lacks an active canonical primary parent or any mapping, validation,
    backfill, count, projection, or postcondition fails. Repository completion does not claim
    production data migration.
  - All nullable list inputs are normalized at the DTO boundary from omitted or explicit null to the
    contract default, or rejected with 422 where null is not allowed. No mapper, domain model,
    repository, migration, or client generator may call list(None), silently erase an existing list,
    or give omitted and explicit-empty updates the same mutation meaning.
  - hard_deadline uses actual calendar-date and local-time DTO types with a valid IANA timezone.
    Impossible dates, invalid clock values, a time without its required timezone, malformed zones,
    and nonexistent local instants are rejected as 422 before application or persistence; date-only
    deadlines remain valid and DST fold handling is deterministic and tested.
  - Authorization and RLS enforce family, member, role, ACL, child-safe projection, and operation
    visibility rules. Task responses never contain raw memory/provider/sensitive text, and origin,
    started_at, blocker, reminder, handoff, audit, idempotency, revision, retention, and opaque push
    fields remain in their owning contracts. Public errors and notifications contain no protected
    identifiers or payloads.
  - "Every create, patch, reassignment, start, complete/reopen and child-facing projection enforces
    canonical risk, approval and consent policy at execution time. Legacy visible_to_child input is
    never direct authority: it is read-only or rejected for legacy mutation and cannot widen the
    effective child projection past consent, sensitivity, ACL, risk, beneficiary/assignee, or
    participation-capability rules."
  - "start_now and clear-marker receipts are written only to the #725 common append-only
    response/audit ledger, using the shared response identity, idempotency and task/operation
    revision contract. FamilyTask and its legacy public record persist neither the marker nor
    start-audit arrays; the v2 projection derives active marker and started_at from the ledger. The
    #725 ledger retains the full immutable start/clear history for its complete audit-retention
    period even after reopen, schedule/blocker changes, deletion, recovery-window expiry, or task
    purge."
  - "Generated Web/iOS/Android contracts, platform repositories/use cases, offline stores, and UI
    states render v2 projections consistently, keep accessibility and narrow-screen behavior, and
    preserve existing complete/reopen and child privacy behavior. #713 start_now, #725
    response/audit, #722/#724 ItemFlow/Handoff, #729/#730/#753 risk and resolver contracts are
    consumed without bypassing their ownership boundaries."
  - "OpenAPI is regenerated from the backend and all Web generated types/client fixtures, Android
    DTO/path/mapper fixtures, and iOS API/DTO/mapper fixtures cover capability-unavailable behavior,
    nullable-list normalization, real deadline validation, active-reassignment conflicts, role-safe
    v2 versus legacy projections, #713 start_now and #725 append-only receipt shapes. Handwritten
    drift or backend-only DTO tests do not satisfy this criterion."
implementation_constraints:
  - "Begin from open draft PR #783 at exact checkpoint 208f35baec7b0c282195e892488cac30f831bdab.
    Stop if its head moves, it becomes non-draft or closed, its head repository changes, or its
    destination is not main. Preserve every correct checkpoint change and repair forward with
    non-force commits; do not reset, discard, reconstruct, rebase, force-push, or import unrelated
    issue work."
  - "This v4 packet carries the complete v3 FamilyTask v2 contract and adds only the review repairs
    stated in this packet: comprehensive capability fencing, legacy-record separation, strict
    migration/backfill, #725 ledger ownership/retention, nullable-list safety, active-reassignment
    conflict, real deadline validation, risk/consent enforcement, legacy child-visibility closure,
    generated cross-platform contracts and final gates. Integrate the approved #713 start_now and
    #725 response/audit contracts; do not create a substitute marker, ledger or child facade."
  - Preserve justified checkpoint implementation, tests and migration intent. Repair flawed code in
    place and add the missing production, migration, OpenAPI and platform coverage without deleting,
    weakening, skipping or quarantining tests merely to pass gates.
  - "No explorer, subagent, schema probe, plan, research summary, partial implementation, or
    intermediate verifier may call submit_bridge_outcome. A research summary is non-terminal. Only
    the lead Cursor task agent may call submit_bridge_outcome once, after every mandatory code,
    migration, generated contract, fixture and test change is complete and every requested in-agent
    verification has finished with truthful evidence. The Bridge remains non-terminal until its
    independent verification passes on the exact final tree and remote Draft PR reconciliation
    confirms PR #783."
