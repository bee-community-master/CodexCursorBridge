required_new_tests:
  - Add freshly migrated PostgreSQL scheduler tests for actual production worker composition, SKIP
    LOCKED claims, family-scoped internal-worker RLS, lease/visibility timeout, unique owner token,
    completion CAS, stale-owner rejection/recovery, two-worker contention, crash before and after
    commit, restart, retry, skew, and exact-once transition/audit/outbox behavior.
  - Add production-path invalidation tests for material edit, pause, revoke, consent withdrawal and
    expiry, member leave/deactivation, source tombstone/unavailability, safety block, registry and
    agreement change, plus execute-time revalidation of every authority. Prove timezone change
    rebooks only pre-start revisions and active boundaries remain fixed.
  - Add transactional persistence/restart tests for restricted attribution, application outbox,
    trial outbox and dispatcher fencing/dedupe. Add database grant/trigger tests that UPDATE and
    DELETE cannot mutate append-only audit/events, while idempotent preview/execute/undo replay
    preserves original evidence and creates no duplicate side effect.
  - Add ZoneInfo calendar tests for next-local-midnight 14-day windows, local-calendar 30-day
    expiry, true 6/12-month review, DST spring/fall and gap/fold boundaries, month ends, and exact
    instants immediately before, at and after every transition.
  - Regenerate OpenAPI and clients, then add real Web loader/action and Android/iOS gateway-to-
    repository-to-use-case-to-ViewModel/screen/composition/navigation tests for every endpoint,
    lifecycle/error state, role-safe redaction, mutation readback, offline/retry behavior and
    accessibility requirement. DTO or mapper tests alone do not satisfy this criterion.
  - "Run focused application/undo tests for server-derived authority, #753 capability fail-closed,
    resource CAS, partial safe application, concurrent execute/replay, TTL exact boundaries and
    human-edit-preserving undo; run the complete final gate set without deleting or weakening prior
    coverage."
