stop_conditions:
  - "Draft PR #779 is closed, non-draft, moved from checkpoint
    aa740b967c9b6e8275a315d54f1ccfc6823c836b before dispatch, targets a branch other than main, or
    no longer has exact Wave3 base 7c3f7a7b82b8af1903d09a512906dc1c931c65c4 as its merge-base."
  - A requested behavior requires credentials, production deployment, a live provider or
    notification service, production database mutation, store submission, or device-only evidence.
  - "A provider-specific #753 resolver or #754 notification-delivery implementation is required
    beyond the canonical capability/effect adapter and opaque transactional outbox contract."
  - Any repair would weaken fail-closed execution, accepted membership, affected-member privacy,
    consent withdrawal, human/source/safety protection, family isolation, RLS, idempotency, CAS,
    owner fencing, atomicity, append-only audit, retention, or generated-client authority.
  - The one-shot submit_bridge_outcome call was consumed before implementation and requested local
    verification completed, or the Bridge cannot keep delivery non-terminal until independent
    verification and exact remote Draft PR reconciliation succeed. Stop with truthful evidence;
    never submit a placeholder, exploration summary, guessed success, or second corrective call.
