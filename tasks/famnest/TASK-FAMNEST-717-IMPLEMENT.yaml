non_goals:
  - Do not change unrelated FamilyOperation behavior or existing operation contracts outside the
    DecisionCard scope of this task.
  - Do not add AI auto-selection or auto-response, anonymous voting, chat, weighted quorum, or
    automatic payment, external messaging, calendar write, assignee change, or protected effect.
  - Do not treat a child DecisionCard result as parent consent; protected effects require a separate
    parent approval resource and source lineage.
  - Do not weaken existing family membership, role, resource ACL, RLS, privacy, idempotency,
    revision, retention, or opaque push contracts.
  - Do not claim production migration execution, live notification deliverability, provider
    behavior, device/store readiness, or product impact from repository tests.
  - Do not modify credentials, deployment configuration, production resources, or external consoles.
acceptance_criteria:
  - The persisted DecisionCard requires question, creator, a visible decision-maker roster, affected
    members or children, two to four stable-ID options, an exact local deadline, decision_policy,
    and no_response_behavior; option effects include bounded schedule, cost, role, and task/handoff
    previews, with cost band none/free/low/medium/high/unknown and optional parent-only exact minor
    currency amount.
  - single_decider accepts exactly one decider, unanimous resolves only when every active roster
    member selects the same option, and majority requires strictly more than half of the roster;
    ties and simple plurality remain unresolved. Non-parent creators include themselves and may add
    only members visible in the Operation projection. Membership loss invalidates the response with
    an audit event but does not recompute the quorum denominator or undo an already-resolved card.
  - Responses are self-owned and replaceable or withdrawable only by that decider before resolve;
    in-progress projections reveal response presence but not other choices, and resolved ACL-safe
    projections reveal only the selected option and aggregate counts while self and parent-audit
    projections retain individual choices. Child sole-decision behavior cannot materialize protected
    schedule, assignment, sharing, sensitivity, spending, medical, or external-transfer effects.
  - The final valid response performs immediate resolve and materialization in one transaction;
    materialization_state is one of not_required, pending_parent_approval, applied, declined,
    blocked, or undone, and pending parent approval points Operation next_action to the approval
    resource without pre-applying the protected effect. Resolution safety failure preserves the
    response and returns resolution_blocked with current blocker, effect preview, revisions, and
    parent review CTA without creating partial resources.
  - Deadlines persist local_date, local_time, timezone, and the resolved UTC instant. DST gaps or
    ambiguous folds return 422 without arbitrary correction, later family-timezone changes do not
    move the stored instant, no_response_behavior defaults to no_change, overdue_grace permits
    exactly 24 hours of new or replacement responses, remind_once observes quiet hours once, and
    escalate_to_parent_review creates only a review item. Parent extension preserves valid
    responses.
  - Pre-resolution cancel requires a typed reason and expected revision from an eligible decider;
    creator or parent may reopen a canceled card as a new revision with all responses recollected.
    Resolve undo has no generic 24-hour limit and succeeds only when every materialized resource is
    untouched, incomplete, unassigned, untransmitted, and dependency-free; otherwise it returns a
    manual-recovery preview without partial deletion. Successful undo removes links atomically,
    preserves audit and the original receipt, and resumes the same decision revision.
  - Create/list/get/update/respond/withdraw/cancel/reopen/undo APIs and generated Web/iOS/Android
    models expose the fixed record, status, deadline, policy, option, effect, response, projection,
    receipt, and undo types. Every mutation requires Idempotency-Key and expected_revision, while
    resolve/materialization also checks Operation expected_revision and expected_plan_revision.
  - "The persistence migration, service authorization, and Supabase RLS enforce same-family,
    accepted-membership, visible-decider, affected-member/child, creator, parent, and child-safe
    projection rules. Raw sensitive option text, exact amount outside parent/audit, other decider
    choices, credentials, and provider payloads never enter notification, metric, push, or child
    projections; audit, receipt, and retention follow #768 rather than inventing a second policy."
  - A single atomic transaction stores the response, quorum decision, protected-effect gate,
    task/handoff resources, Operation link, next action, revision and plan_revision, audit, and
    activity receipt. Replay and retry return the same receipt without duplicate resources or
    notifications, and stale revisions, duplicate options, invalid responses, missing previews, or
    cross-family references fail closed with no partial commit.
  - OpenAPI, generated clients, role-safe fixtures, Web, Android, and iOS flows agree on status and
    projection shapes, opaque sync_needed/projection_revision_hint/opaque_event_id push payloads,
    422 validation, 403/ACL failures, 409 revision conflicts, accessibility, offline read-only
    behavior, and privacy-safe error/telemetry content.
