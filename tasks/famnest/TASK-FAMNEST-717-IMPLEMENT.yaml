required_new_tests:
  - Add backend and migrated-Postgres tests for all three policies, tie/simple-plurality behavior,
    visible roster and creator rules, membership invalidation, role/RLS matrices, deadline DST
    validation, grace/no-response behavior, revision/idempotency replay, protected-effect approval,
    blocked resolution, and strict no-partial undo.
  - Add generated OpenAPI and Web contract/use-case tests for every endpoint, discriminator,
    projection privacy boundary, opaque push shape, 422/403/409 error, offline/read-only, and
    accessibility state.
  - Add Android data/application/presentation tests and iOS Core/API/App tests for serialization,
    role-safe projections, immediate resolve/materialization receipts, strict undo, revision
    conflicts, offline behavior, and accessible state rendering.
