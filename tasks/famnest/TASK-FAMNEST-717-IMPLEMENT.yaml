id: TASK-FAMNEST-717-IMPLEMENT
repository: famnest
title: Implement DecisionCard choice, quorum, resolution, and atomic materialization contracts
spec_version: 1
goal: "Implement issue #717 end to end on top of the existing FamilyOperation contract, including
  the DecisionCard ledger, role-safe projections, revisioned response and resolution APIs, protected
  effect approval, atomic task/handoff materialization, persistence, generated contracts, and
  Web/iOS/Android clients without weakening existing family authorization or audit boundaries."
