id: TASK-FAMNEST-718-IMPLEMENT
repository: famnest
title: Implement FamilyTask v2 execution, assignment, readiness, handoff, and lineage contracts
spec_version: 1
goal: "Implement issue #718 as the canonical FamilyTask v2 execution contract inside
  FamilyOperation, preserving existing task storage and permissions while adding revisioned roles,
  time windows, readiness, execution state, handoff, immutable origin lineage, migration, generated
  OpenAPI, and Web/iOS/Android compatibility."
