non_goals:
  - Do not create a child-only canonical status store, a second handoff ledger, or a second
    reminder/ItemFlow/evidence authority.
  - Do not allow legacy role/time/core-field writes or generic guarded-child offline auto-rebase;
    retain only compatible reads and offline complete/reopen with strict conflict handling.
  - Do not grant permissions through executor, owner, helper, beneficiary, or choice_scope fields;
    existing MemberPermission, family membership, ACL, and RLS remain authoritative.
  - Do not copy ItemFlow raw content, sensitive provider payloads, reminders, memory text, or
    authorization data into FamilyTask.
  - Do not claim production migration execution, live provider/calendar behavior, device/store
    readiness, or production data effects from repository tests.
  - Do not modify credentials, deployment configuration, production resources, or external consoles.
acceptance_criteria:
  - FamilyTaskV2 persists executor_member_id, optional owner/helper/beneficiary member IDs,
    hard_deadline with local date plus optional local time and timezone, independent planned_window,
    choice_scope, bounded ready/done conditions and required_items, item_flow_ref list,
    execution_context, blocked_reason, immutable origin_lineage, representative_origin, revision,
    projected started_at, canonical task_status, derived execution_state, and is_overdue. Date-only
    deadlines remain date-only and reminders remain in their separate ledger.
  - Role assignment validates same-family membership and resource ACL without adding authority;
    omitted owner defaults to executor; helper and beneficiary lists are bounded and unique; an
    executor who cannot read the resource is rejected. Allowed choice_scope values are exactly
    fixed, time_within_window, order_within_operation, helper_request, and execution_method.
  - "Canonical storage remains open, completed, or deleted. Deleted tasks disappear from Active,
    plan, and Today projections. Execution state is derived in the exact order completed, blocked,
    handoff, not_ready, in_progress, ready, with overdue represented only by is_overdue. start_now
    records a #725 response/audit active marker and server started_at without changing task
    structure or plan_revision; reopening clears the active marker but retains history."
  - blocked_reason uses the fixed typed codes missing_item, waiting_on_person, waiting_on_decision,
    schedule_conflict, external_dependency, not_ready, assignment_mismatch, or other with bounded
    note. Conditions, required items, ItemFlow/evidence/origin references, labels, summaries, and
    mitigation notes enforce the issue bounds, reject duplicate scopes and blank values with 422,
    and reject cycles or dangling dependencies atomically.
  - Handoff extends the existing TaskAssignmentResponse record. Reassignment projects an active
    handoff until the new executor accepts or requests help, and no extra handoff authority is
    created. Origin lineage is immutable after creation; representative_origin is deterministic in
    source_verified, family_agreement, user_added, ai_suggestion order and edits add references
    rather than overwriting provenance.
  - The v2 command and read DTOs are generated in OpenAPI and consumed by Web, Android, and iOS.
    assignee_member_id, due_date, and due_time remain read-only compatibility projections. Legacy
    role/time/core-field mutations return unsupported_legacy_mutation; only existing reads and
    offline complete/reopen remain compatible. All v2 mutations require expected_revision and
    Idempotency-Key, while stale updates return 409 plus the latest projection.
  - Offline complete/reopen stores queue-time Task revision as outbox base_revision. Any mismatch
    returns a conflict receipt even when the requested target state already matches, never
    auto-rebases or silently applies, and guarded child reopen is excluded from generic offline
    recovery. Client projections and conflict UI preserve the latest server state and explicit
    retry.
  - The migration is a single strict all-dataset transaction. It deterministically maps legacy
    assignee and due/source fields, backfills deleted tasks still inside the seven-day recovery
    window, records migration-review audit for invalid assignees corrected to the family canonical
    primary parent, and aborts with no changes when any family lacks an active primary parent or any
    validation/backfill/projection check fails. Repository completion does not claim production data
    migration.
  - Authorization and RLS enforce family, member, role, ACL, child-safe projection, and operation
    visibility rules. Task responses never contain raw memory/provider/sensitive text, and origin,
    started_at, blocker, reminder, handoff, audit, idempotency, revision, retention, and opaque push
    fields remain in their owning contracts. Public errors and notifications contain no protected
    identifiers or payloads.
  - "Generated Web/iOS/Android contracts, platform repositories/use cases, offline stores, and UI
    states render v2 projections consistently, keep accessibility and narrow-screen behavior, and
    preserve existing complete/reopen and child privacy behavior. #713 start_now, #725
    response/audit, #722/#724 ItemFlow/Handoff, #729/#730/#753 risk and resolver contracts are
    consumed without bypassing their ownership boundaries."
