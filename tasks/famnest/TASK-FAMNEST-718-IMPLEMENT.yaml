required_new_tests:
  - Add backend and migrated-Postgres tests for exact time/DST/date-only behavior, role/ACL matrix,
    all derived execution-state precedence, start marker revisions, bounds, cycles, lineage,
    handoff, legacy-write rejection, idempotency, and strict offline conflict.
  - Add migration fixtures for valid backfill, deleted recovery, invalid assignee correction,
    missing primary-parent global abort, and all-or-nothing validation.
  - Add OpenAPI and Web, Android, and iOS contract/UI tests for v2 DTOs, read-only legacy
    projections, offline completion/reopen conflicts, child-safe projections, accessibility, and
    opaque error/notification shapes.
