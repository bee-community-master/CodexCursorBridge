non_goals:
  - Do not add an in-memory, process-local, access-triggered, model-only, audit-only, or
    string-presence substitute for durable DecisionCard behavior, PostgreSQL verification, a due
    worker, authoritative authorization, generated clients, or canonical FamilyTask creation.
  - Do not add AI auto-selection or auto-response, anonymous or weighted voting, chat, generic
    surveys, or automatic payment, external message, calendar write, assignee change, medical
    action, or protected effect from a child response.
  - Do not treat DecisionCard response as
  - Do not expose exact amounts, other deciders' choices, sensitive option text, identifiers,
    provider data, or destination data through child/non-parent projections, cursor tokens,
    idempotency records, errors, telemetry, notifications, or opaque push payloads.
  - Do not claim production migration, scheduler, notification delivery, provider behavior,
    device/store readiness, or product impact from repository-local evidence.
acceptance_criteria:
  - Persistence and the transaction boundary are real. Decision cards, responses, immutable
    receipts, materialization links/fingerprints, approval links, audit, activity receipts,
    Operation revisions, and idempotency outcomes are represented in normalized durable PostgreSQL
    state, included in full-payload/load/persist/sync policies, and restored after process restart.
    The final qualifying response, quorum evaluation, protected-effect gate, canonical task or
    handoff creation, Operation link/next action, decision revision, Operation revision and
    plan_revision, audit, activity receipt, and opaque outbox event commit through one repository
    unit-of-work transaction. Concurrent requests and restart/retry converge to one response and one
    byte-equivalent receipt with no duplicate resource, link, audit, or notification.
  - Every mutation validates authorization, accepted/active membership, Operation/resource ACL,
    visible deciders and affected members/children, idempotency fingerprint, decision and Operation
    expected revisions, deadline/grace eligibility, option/effect preview, and materialization
    safety before mutating state. A resolution-blocked or stale request may preserve only the final
    response when the fixed contract explicitly permits it; it creates no task, handoff, approval,
    Operation link, audit side effect, or partial resource. Every other 4xx or 5xx path, including a
    post-grace or invalid update, leaves durable readback byte-for-byte equivalent to pre-request
    state. Tests inject failures at each transaction stage and prove complete rollback.
  - Authorization and RLS are least privilege. Card reads require accepted membership plus the
    owning Operation ACL. Response choice reads are self-or-parent-audit only; ordinary in-progress
    projections expose presence only, and resolved ACL-safe projections expose selected option plus
    aggregate counts. A member may mutate only their own active response through authorized service
    APIs; receipt and materialization tables are server-write-only and readable only through
    authorized projections, and membership is enforced on every relation. Freshly migrated
    PostgreSQL API/RLS tests cover parent, creator, decider, child, caregiver/grandparent child
    scope, accepted and pending members, unrelated accepted members outside the Operation ACL,
    inactive/left members, and cross-family users for direct SELECT/INSERT/UPDATE/DELETE attempts.
  - Idempotent replay never returns a raw stored card or privileged receipt. The server either
    stores an actor/role-safe response or recomputes projection under current membership and ACL
    without broadening visibility. First response and replay are byte-equivalent for the same actor
    and role, while parent, non-parent, child, and unauthorized replays observe their exact
    projection; a child replay cannot reveal an exact currency amount or another decider's choice.
  - "Strict undo is revisioned and indefinite, not #730's 24-hour undo. At materialization the
    server stores immutable per-resource fingerprints covering canonical #718 revision,
    title/summary, status/completion, executor/owner/helper/beneficiary assignment, deadline/window,
    handoff, external-send state, dependency and follow-up links, origin/source lineage, and every
    other human-editable or externally observable field. Undo rereads every resource and Operation
    link, requires expected Decision and Operation revision plus plan_revision, and atomically
    rejects missing, edited, completed, reassigned, transmitted, or dependent resources with a typed
    manual recovery preview and zero deletion. Success removes every resource and Operation link,
    advances Operation revisions consistently, restores the same decision revision to its response
    state, and preserves original receipt and audit."
  - "`_visible_operation_member_ids` and equivalent placeholders are removed. Creation, update,
    response, cancel, reopen, deadline extension, resolve, and undo derive visibility from the real
    owning Operation/resource ACL and current accepted membership. Non-parent creators include
    themselves and may add only visible members; affected members and children are same-family,
    accepted/active where applicable, and child-scope visible. Membership loss or ACL revocation is
    delivered by real membership/resource lifecycle hooks, invalidates only the member's active
    response with one immutable reasoned audit event, preserves the roster denominator, and never
    reverses an already resolved decision."
  - Deadlines store local date, local time, IANA timezone, and immutable resolved UTC instant; gaps
    and folds return 422. A durable fenced due-worker claims deadline, exactly-24-hour grace close,
    once-only reminder, and parent-review work with lease, retry, restart, and concurrent-worker
    safety. `remind_once` waits through configured quiet hours and emits one opaque notification;
    `escalate_to_parent_review` creates only one durable review item and no decision/effect
    mutation; `no_change` mutates no product resource. New or replacement responses are accepted
    only during the exact grace interval, and parent deadline extension preserves valid responses.
  - Response projection selects the current active response first and otherwise the newest terminal
    response for that decision revision; replacing option A with B cannot project the earlier
    withdrawn A. Replace, withdraw, membership invalidation, revision reset, final-response resolve,
    blocked resolve, reopen, and role-safe list/get/replay tests assert exact response order, state,
    choice visibility, aggregate counts, and receipt.
  - "List pagination implements the #768 opaque cursor contract with deterministic stable ordering,
    snapshot-safe continuation, bounded limit, malformed/tampered/cross-family cursor rejection, no
    duplicate or skipped card across pages, and content-free tokens. It does not ignore the cursor,
    repeatedly return page one, or always return null. OpenAPI is canonical and regenerated; Web
    uses generated request/response/status types and a real API repository/use case/UI flow, Android
    wires generated-derived DTO/path, transport, repository, use case, DI, ViewModel and accessible
    Compose flow, and iOS wires API client, DTOs, gateway, composition, navigation and accessible
    SwiftUI flow. All create/list/get/update/respond/withdraw/cancel/reopen/undo requests, role-safe
    projections, receipts, cursors, 422/403/409 errors, offline read-only states, and opaque push
    fixtures conform across all three platforms."
  - "Materialization consumes the canonical #718 FamilyTask v2 and handoff creation port, DTO,
    transaction, role/ACL validation, immutable origin_lineage, representative_origin, revisions,
    assignment, deadline/window, readiness, and idempotency behavior at the #718 final-head
    contract. It never constructs the legacy FamilyTask model directly, never invents a random
    source UUID, and preserves DecisionCard ID plus decision revision and option/effect source
    lineage. If the exact #718 final-head contract is unavailable or incompatible in PR #782's
    ancestry, stop with concrete dependency evidence instead of synthesizing a parallel task or
    silently copying another issue's implementation."
  - "The full issue contract remains intact: deterministic single_decider, unanimous, strict
    majority, tie and plurality behavior; response privacy; child protected-effect parent approval;
    resolved status separate from materialization state; revision reset; cancel/reopen; exact cost
    redaction; resolution_blocked; Operation next action; audit/retention; and content-free #754
    push are all covered by non-tautological tests. The preserved PR remains descended from exact
    Wave3 base 7c3f7a7b82b8af1903d09a512906dc1c931c65c4 and contains no unrelated Wave3 issue."
  - Ruff reports zero findings for every changed Python file, migrations are actually applied to a
    fresh PostgreSQL database rather than checked by SQL string presence, and focused unit/API,
    concurrency/restart, migrated-PostgreSQL/RLS, OpenAPI generation, Web, Android, iOS, migration,
    and complete repository gates all pass on the final tree. Tests assert durable rows,
    transactions, ACL projections, exact bytes, cursor continuity, worker fencing, real canonical
    resource effects, and restart behavior rather than mocks or status-only simulations.
implementation_constraints:
  - "Begin from open draft PR #782 at exact checkpoint 7b3a80d77caa2f84d5aca3d94648471f39146e99;
    stop if its head moved, it is not open/draft, its destination is not main, or its merge-base
    with main is not exact Wave3 base 7c3f7a7b82b8af1903d09a512906dc1c931c65c4."
  - "Preserve justified checkpoint work and repair forward on the existing branch. Do not delete
    tests merely to pass gates, rebase, force-push, discard the checkpoint, or import unrelated
    Wave3 commits. A canonical #718 dependency may be integrated only through its approved
    final-head contract and ancestry plan; stop rather than hand-copy or fork its authority."
  - Use the canonical PostgreSQL unit-of-work, repository load/persist/sync policy, operation ACL,
    membership lifecycle, due-worker, outbox, generated-client, API dependency-injection, and
    FamilyTask v2 ports. Do not introduce a parallel transaction manager, polling-only deadline
    authority, client-trusting ACL, bespoke task ledger, raw projection cache, or second
    idempotency/retention policy.
  - Validation is side-effect-free and occurs before acquiring a write transaction where possible;
    final CAS revalidation occurs inside the transaction. Persist deterministic fingerprints,
    receipt keys, worker claim keys, cursor ordering keys, and source lineage explicitly. Keep
    audit, errors, cursors, push, notifications, metrics, and traces bounded and content-free.
