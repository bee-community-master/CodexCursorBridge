required_new_tests:
  - "Add migrated-PostgreSQL unit-of-work tests for all four durable ledgers and Operation linkage:
    final-response commit, every injected failure stage, stale decision/Operation revisions, blocked
    resolve, exact replay, process restart, and simultaneous first-response/replay. Assert
    byte-equivalent pre/post state for every 4xx/5xx except the explicitly preserved blocked final
    response, plus exactly-one receipt/resource/audit/outbox after successful retry."
  - Add fresh-migration direct-SQL and real-API authorization/RLS matrices for parent, creator,
    decider, child, caregiver/grandparent scope, accepted/pending/inactive/left members, unrelated
    accepted member outside the Operation ACL, and cross-family actor across card, response,
    receipt, materialization, approval-link, audit, and idempotency relations. Add
    first-versus-replay byte and redaction assertions for every role.
  - Add strict-undo regression tests that edit each fingerprinted FamilyTask v2/handoff and
    Operation field independently, including title, assignment, revision, completion, transmission,
    dependency and follow-up; each must yield a complete manual-recovery preview and zero partial
    deletion. Add successful all-resource undo with links/revisions/receipt/audit preservation and
    concurrent undo fencing.
  - Add real membership/ACL lifecycle-hook and durable due-worker tests for response invalidation,
    roster-denominator preservation, quiet-hours delay, once-only reminder, exact deadline and
    24-hour grace boundaries, parent extension, mutation-free review escalation, overlapping worker
    claims, crash before/after commit, lease expiry, restart, and replay.
  - "Add response ordering and #768 cursor tests, then regenerate OpenAPI and add Web/Android/iOS
    generated-contract plus real repository/use-case/DI/navigation/UI tests for every endpoint,
    projection, receipt, error, offline state, accessibility behavior, and content-free opaque push.
    Add integration tests proving Decision materialization invokes the canonical #718 final-head
    FamilyTask v2/handoff port once with exact Decision revision and source lineage."
