non_goals:
  - Do not replace the authoritative credit ledger, billing entitlement, or native purchase flows
    owned by existing billing contracts.
  - Do not give Web a checkout or store purchase capability; Web only explains native purchase and
    links to the official store surface.
  - Do not expose exact balance, expiry, price, purchase history, private AI usage, member/child
    attribution, raw prompt/output, provider ID, or plan title to child/caregiver projections.
  - Do not change production store products, provider consoles, live billing, push delivery,
    production migrations, or financial settlement evidence.
  - Do not modify credentials, deployment configuration, production resources, or external consoles.
acceptance_criteria:
  - GET /v1/families/{family_id}/billing/credits returns the generated full/availability_only union.
    Parent full view includes available_centi_credits, reserved_centi_credits,
    next_expiring_centi_credits, next_expires_at, entitlement_kind, actor/family can_purchase, and
    balance_revision. Child and caregiver views contain only is_available, can_request_parent, and
    balance_revision, never exact amount or expiry.
  - "The transaction endpoint is parent-only cursor pagination with category exactly ocr, stt, llm,
    private_ai_usage, grant, expiry, purchase, refund, or adjustment; signed integer centi-credit
    amount, occurred_at, bounded status, and display reason are safe, ordered by occurred_at DESC
    then ledger_event_id DESC with default limit 50, max 100, and #768 invalid_cursor 422. Raw
    input, source filename, prompt/output, provider request ID, plan title, and member/child IDs
    never appear."
  - Insufficient responses use code insufficient_credits. Parent payload contains stage,
    required_centi_credits, available_centi_credits, can_purchase, balance_revision, and nullable
    resume_token; child/caregiver projection removes exact amount and stage detail while offering
    the parent-request action. A stale balance is re-read and reserve is retried before provider
    dispatch.
  - Every platform uses integer centi-credit on the wire and locale-aware two-decimal display,
    distinguishes loading, stale/offline read-only, zero, insufficient, pending, success, refund,
    and error states, and shows the last-confirmed timestamp offline without claiming AI or purchase
    availability. Parent Web/iOS/Android expose balance, expiry, category aggregate, history, and
    insufficient recovery; native purchase CTA prevents double taps and Web never starts checkout.
  - Parent native purchase guidance displays product and purchase fact with localized store price;
    child/caregiver UI never leaks exact balance, expiry, price, purchase history, private member
    usage, or private-plan existence and only offers AI availability and a parent request action.
    Dynamic Type/font scale 200%, VoiceOver/TalkBack, keyboard navigation, narrow screens, and
    reduced motion keep amount and CTA visible and distinguish state without color alone.
  - Recurring-grant expiry notifications fire once per billing period at 70, 90, and 100 percent to
    active parents only. Top-up-only lots have no expiry thresholds, but total-balance zero is
    deduped once. APNs/FCM payloads are opaque sync_needed, projection revision hint, and opaque
    event ID only; amount, category, member, and title are resolved after authorized sync.
  - Authorization and RLS enforce same-family active membership, parent history access,
    child/caregiver availability-only projection, cross-family denial, and privacy-safe
    error/telemetry. Existing ledger, metering, reserve/settle, purchase/replay, idempotency,
    revision, retention, and audit authority remain intact; no private AI content or plan/member
    attribution reaches ledger, metric, notification, or generated client fixtures.
  - OpenAPI, generated Web/iOS/Android clients, platform repositories, accessibility state
    contracts, insufficient first-stage flow, and OCR-success-to-LLM-resume flow use the same wire
    discriminator, amount formatting, cursor, stale revision, error, and privacy semantics. Every
    mutation/retry remains idempotent and does not duplicate ledger events, notification thresholds,
    reserves, or resumes.
