required_new_tests:
  - Add backend and migrated-Postgres tests for full versus availability-only projection,
    parent/caregiver/child/cross-family matrix, integer amount/category/cursor bounds,
    invalid_cursor, stale reserve retry, replay/idempotency, threshold dedupe, opaque push, and
    privacy redaction.
  - Add Web contract/use-case/UI tests for balance/history/insufficient and native-purchase guidance
    across loading, offline/stale/error/pending/refund/accessibility states.
  - Add Android data/platform/presentation and iOS API/App tests for generated DTOs, locale
    formatting, parent versus child projection, native purchase pending/double-tap, OCR resume,
    accessibility, and threshold/opaque notification fixtures.
