non_goals:
  - Do not implement the iOS Share Extension UI/file-transfer lifecycle owned by issues 749 and 750.
  - Do not replace the existing generic file_upload source type, break legacy single-upload rows, or
    add a general source type, background crawler, photo-library watcher, or OS-share push.
  - Do not bypass existing authentication, upload validation, ownership, or candidate-approval gates.
  - Do not store raw bytes, URI, filename, source app, client item ID,
    family/member/child/input/source IDs in logs, metrics, crash reports, deep links, or push
    payloads; server authorization/audit may retain bounded identifiers under its retention policy.
  - Do not claim production bucket/provider/notification deliverability, live migration,
    device/store readiness, or external side effects from repository tests.
  - Do not modify credentials, deployment configuration, production resources, or external consoles.
acceptance_criteria:
  - One OS-share job creates exactly one logical document, one input_item, and one candidate
    package. Native and backend reject original_image_count >= 11 before content processing. After
    validation and byte-identical dedupe, one to five ordered images use representation
    multi_source_images with immutable zero-based source ordinals; six to ten images use
    representation synthesized_pdf with one authoritative PDF source, original_image_count, and
    page_count. Existing file_upload source type remains and ingestion_surface=os_share is the only
    new entry-surface discriminator.
  - POST intents, source complete-upload, refresh-shared-image-upload-urls, and
    finalize-shared-image- document endpoints are present in generated OpenAPI and clients with
    existing auth/session, envelope, error, and 24-hour Idempotency-Key conventions. Intent
    validates role-specific child profile scope, file count/ordinal/MIME/page shape and returns
    input/source IDs, 15-minute signed URL, required headers, and expiry. Same-key same-payload
    replay returns identical IDs; changed payload is an idempotency conflict.
  - Complete validates actual byte_size, MIME and magic bytes, 20MB size, SHA-256, object ownership,
    input/source family, and verified duplicate hashes. It transitions only source state to
    uploaded/verified and never starts OCR, LLM, or candidate generation. Replay succeeds only for
    the same payload; changed metadata conflicts. Refresh issues URLs only for incomplete sources,
    never adds or mutates ordinal/metadata, and refuses verified/finalized/canceled/expired sources.
  - Finalize accepts one or more verified source IDs in original ordinal order. Multi-source permits
    partial success only when the accepted remainder is one to five and retains original ordinal
    values; synthesized PDF requires its single complete PDF and never partial page finalize.
    Accepted source set/order becomes immutable, the AI dispatch outbox is created exactly once,
    replay returns the same candidate pipeline, changed set/order conflicts, and post-finalize
    add/complete/ refresh/accepted-set mutation is rejected.
  - Persistence adds exact ingestion_surface, representation, original_image_count, page_count,
    submitted_by_member_id, finalized_at, and source_file input FK/immutable ordinal/verified
    sha256/byte_size/MIME/status fields with unique input+ordinal and verified input+sha256 indexes.
    Existing single-upload rows migrate as ordinal-zero sources, single candidate/source assumptions
    become input-based joins, and migration plus migrated PostgreSQL smoke validates legacy and both
    new representations atomically with no partial commit.
  - Multi-source OCR fans out one job per accepted source with immutable ordinal; synthesized PDF
    preserves page ordinal. Provider retries are source/page scoped, LLM starts only after all OCR
    is terminal, one or more successful extractions cause exactly one ordered LLM call and
    candidate, partial terminal failure stores missing_page_ordinals plus warning and blocks parent
    approval until warning acknowledgement audit, and all-failure creates no candidate but remains
    retryable.
  - Credit orchestration reserves accepted image/PDF pages at 100 integer centi-credits each before
    dispatch, uses stable logical/stage/ordinal keys for retries, settles successes and releases
    failures, reserves downstream LLM separately, and resumes from retained extraction when the LLM
    reserve is insufficient. Logical document/object/source count never changes page billing, and no
    duplicate reserve/settle/ledger event occurs on replay or crash retry.
  - Intent, complete, refresh, finalize, read, candidate approval, and source access enforce active
    same-family membership, role-specific child scope, submitted account scope, parent-only
    approval, object ownership, and RLS. Submitter owner access is limited to their own submitted
    originals and candidate while active, is immediately revoked on leave/suspend/delete/account
    deletion, and parent sensitive-input revocation records actor, reason, input, affected member,
    and timestamp in audit. Cross-family, inactive, out-of-scope, and other-account staging
    references fail closed.
  - Non-protected submitter candidate readiness creates only the existing in-app parent notification
    row; extension/receiver performs no event endpoint call; main app records only received,
    presented, submitted, and candidate_ready product interactions. Telemetry and crash/error paths
    contain no raw bytes, URI, filename, source app, client correlation ID, or family/member/child/
    input/source ID; APNs/FCM remains opaque sync-needed only.
  - "Shared staging fixtures and generated Web/iOS/Android data clients implement staging -> staged
    -> claimed -> uploading -> awaiting_user_choice or ready_to_finalize ->
    finalized/cancelled/expired, account limits of three bundles, fifteen files, and 200MB with
    24-hour TTL, single-consume host claim, no auto-delete on limit overflow, explicit
    retry-versus-successful-subset choice after 1s/ 3s retries, and idempotent cleanup on cancel,
    expiry, logout, or account change. #749/#750 remain separate native ingress implementations."
  - OpenAPI, generated Web/iOS/Android contracts, role-safe fixtures, application errors, signed URL
    expiry, idempotency, revision, privacy, retention, and accessibility states agree. Existing
    generic upload/read/approval flows remain backward compatible, and no production migration,
    provider, bucket, push, or store evidence is asserted by repo-local completion.
