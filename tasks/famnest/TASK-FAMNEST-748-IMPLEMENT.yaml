stop_conditions:
  - A requested behavior requires credentials, production deployment, live
    storage/provider/notification, production database mutation, store submission, or device-only
    evidence.
  - A requested native ingress change belongs to issues 749, 750, or another out-of-scope native
    delivery issue rather than the shared image document contract.
  - Any implementation would weaken file validation, ownership, RLS, parent-only approval, privacy,
    idempotency, revision, cleanup, retention, or opaque telemetry/push guarantees.
