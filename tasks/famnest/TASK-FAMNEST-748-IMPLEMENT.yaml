required_new_tests:
  - Add backend and migrated-Postgres tests for 1-5 images, 6-10 PDF, >=11 rejection,
    size/MIME/magic/SHA/ownership, duplicate hash, idempotency/replay/conflict, signed URL refresh,
    immutable finalize and auth/RLS/privacy/revocation.
  - Add AI fan-out/fan-in and credit reserve/settle/release/retry/resume tests for ordered partial
    OCR, warning acknowledgement, all-failure, single LLM call, insufficient first-stage and
    mid-pipeline, and duplicate ledger prevention.
  - Add generated OpenAPI plus Web, Android, and iOS common data/fixture tests for both
    representations, staging state machine, limits/TTL/cleanup, opaque telemetry/push,
    accessibility, and backward-compatible single upload; leave
