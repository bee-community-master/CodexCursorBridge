required_new_tests:
  - "Add real-adapter mutation and server-authority tests for action/resource/affected-member/risk/
    protection spoofing, missing #753 capability fail-closed behavior, CAS, idempotent replay,
    atomic audit/outbox, partial safe application, concurrent execute, actual safe-subset undo, and
    undo TTL immediately before, exactly at, and immediately after expiry."
  - "Add central invalidation tests from every production mutation path: material edit, pause,
    revoke, consent withdrawal/expiry, safety block, source invalidation, member leave/deactivation,
    registry change, and agreement change. Prove exact revision/link/quorum validation,
    authoritative consent timestamp/timezone, actual review patch audit, family-local 14/30-day and
    6/12-month calculations, DST gap/fold, month-end, pre-start rebook, fixed active boundary, and
    legacy first material edit."
  - Add migrated-PostgreSQL worker and API tests for atomic claim, lease/visibility timeout,
    fencing, stale recovery, two-worker contention, crash/restart before and after commit,
    synchronized memory and trial state, unique transition/outbox keys, append-only audit/version
    history, parent/child/ unrelated/cross-family RLS reads and writes, restricted attribution,
    retention purge, and privacy family-lock behavior.
  - Add OpenAPI regeneration and Web/Android/iOS integration tests proving generated-client calls
    for schedule/get/review/preview/execute/list/get/undo, exhaustive lifecycle/application/error
    states, preview-versus-applied copy, loading/offline/stale/retry/terminal errors, role-safe
    redaction, CTA state changes, accessibility semantics, and navigation discoverability.
  - Run the full repository gates and add regression assertions for exact boundary instants,
    concurrent execution/undo, stale revisions and owners, migrated DB/RLS mutations, actual
    resource effects, restart durability, and failure visibility. Remove tautological assertions and
    prove report counts and generated artifacts match the final tree.
