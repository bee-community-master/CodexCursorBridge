non_goals:
  - Do not add a fake, in-memory-only, audit-only, or status-only substitute for a resource
    mutation, claim worker, durable outbox, trial invalidation, or undo effect.
  - "Do not implement provider-specific resolver behavior owned by #753 or notification delivery
    owned by #754. Integrate only through their bounded capability and opaque outbox contracts."
  - Do not let legacy_unreviewed, high, very_high, delete, or purge enter generic trial or undo.
  - Do not store sensitive memory text, provider payloads, raw child/member attribution,
    credentials, contacts, or other protected content in public DTOs, audit JSON, metrics, or
    notifications.
  - Do not claim production scheduler execution, provider deliverability, migration, device/store
    readiness, or product impact from repository evidence.
acceptance_criteria:
  - "Execution and undo are real and server-authoritative. Requests carry only lifecycle/resource
    identity, idempotency identity, and expected resource revision. The server derives the exact
    action registry entry, risk and resource type, affected members, current consent, source,
    protection, human-edit, completion/cancel, safety, and agreement-conflict state. Spoofed action,
    resource, affected-member, risk, or protection data is rejected. A supported execute invokes the
    real #753 adapter effect with resource CAS; immutable application audit and opaque #754 outbox
    are committed atomically with that effect. Concurrent execute/replay produces one effect. Undo
    rereads current revision and field provenance, reverts only a safe subset that preserves later
    human edits, and records undone only after the real revert commits exactly once."
  - "When the #753 adapter for an action/resource is absent or incomplete, preview may return an
    explicit unavailable capability and explanation, but execute must fail closed as blocked or a
    typed capability error and must never return applied, advance a revision, or emit an applied
    audit/outbox event. High, very_high, delete, and purge use their bounded-context recovery path,
    not generic undo. Reversible low/medium undo obeys the shorter of registry TTL and 24 hours with
    exact before/at/after-boundary and concurrent execute/undo coverage."
  - One central invalidation coordinator receives material edit, pause, revoke, consent withdrawal
    or expiry, safety block, source invalidation, member leave/deactivation, and relevant registry
    or agreement changes. It immediately fail-closes every applicable scheduled/active/review-due
    trial and application, synchronizes operational-memory status, and emits one immutable reasoned
    transition. Material review creates a real patched revision, computes exact changed field paths
    server-side, records material decision/reason immutably, invalidates old consent/approval/trial,
    and restarts the required lifecycle; client booleans are never authority.
  - "Trial eligibility and schedule are server-authoritative: exact memory/policy revision and
    linkage, #729 final consent timestamp and affected-member quorum, registry risk/mode, current
    member/source/safety/agreement state, and family-settings IANA timezone are validated. The next
    local-midnight half-open 14-calendar-day window snapshots local/UTC endpoints, timezone ID, and
    offset. Pre-start timezone change rebooks a new revision; an active boundary never moves. Expiry
    uses 30 family-local calendar days and periodic review uses true 6/12 calendar months, including
    DST gaps/folds, month ends, timezone change, and legacy first-material-edit behavior."
  - "A production worker path claims due starts, ends, expiries, and 6/12-month reviews through the
    authoritative database. Atomic claims have visibility timeout/lease, unique claim token and
    owner fencing, stale-claim recovery, and at-least-once replay safety. Trial state,
    operational-memory state, append-only transition/application/version audit, and one opaque #754
    outbox record share a transaction and unique transition/outbox keys. Crash before/after commit,
    retry, restart, skew, stale owner, and overlapping workers never wedge work or duplicate a state
    transition, side effect, audit row, or outbox event."
  - "Persistence and authorization are complete. Application and transition history is append-only,
    while mutable projections are separate. Raw affected-member attribution is stored only in an
    access-restricted relation or opaque reference, never public DTO/audit JSON. RLS and service
    authorization enforce parent, child, unrelated, affected-member, role, and cross-family
    boundaries on actual FastAPI reads and writes against a freshly migrated PostgreSQL database.
    #768 retention/purge worker and privacy family-lock paths include all new audit, projection,
    outbox, and attribution data without weakening required immutable retention."
  - The OpenAPI document and generated clients expose trial create/get/review and application
    preview/execute/list/get/undo with exhaustive statuses and typed revision, idempotency,
    capability, redaction, and error shapes. Web uses the generated client rather than hardcoded
    trial_active/applied samples. Android wires transport/repository/use case/DI/ViewModel/Compose
    actions. iOS wires API gateway/composition/navigation/actions. All platforms distinguish preview
    from applied, expose consent, scheduled, active, review, paused, expired, blocked, skipped,
    failed, undone, and undo-conflict states, and provide continue/modify/stop and safe undo CTAs.
  - Web, Android, and iOS show loading, offline, stale, retryable and terminal errors with role-safe
    redaction; actions are discoverable through normal family-operation navigation and meet platform
    accessibility semantics for labels, focus/reading order, status announcements, touch targets,
    dynamic text, contrast, and disabled/busy states. Integration tests prove real generated-client
    requests, state updates, error rendering, navigation, and no protected-memory disclosure.
  - The preserved PR checkpoint remains descended from exact Wave3 base
    7c3f7a7b82b8af1903d09a512906dc1c931c65c4, contains no unrelated Wave3 issue, and finishes with
    all specified focused, migrated-database, generated-contract, and repository-wide verification
    passing. Test assertions must prove exact time, transition, CAS, mutation, restart, RLS, and UI
    outcomes rather than tautologies, mocks of the behavior under test, or status-only simulations.
implementation_constraints:
  - "Begin from draft PR #779 at exact checkpoint 3fa5828d1278f01f8108acd9892ee0a6ce104444; stop if
    its head moved, it is not open/draft, or its merge-base with main is not exact Wave3 base
    7c3f7a7b82b8af1903d09a512906dc1c931c65c4."
  - Keep the v1 implementation and its justified integration paths, repairing or replacing flawed
    behavior without deleting tests merely to pass gates. Do not import commits or code owned by
    another Wave3 issue.
  - Reuse existing domain ports, transaction boundaries, worker infrastructure, generated-client
    workflows, DI/composition conventions, privacy locks, and architecture constraints; add no
    parallel in-memory authority or bypass around canonical persistence and authorization.
  - Use authoritative server reads and typed capability results at every trust boundary. Client
    request fields, display state, cached DTOs, and audit rows are not authoritative lifecycle,
    registry, consent, protection, resource-revision, or risk inputs.
  - Keep audit/outbox payloads content-free and provenance explicit. Use append-only events with
    deterministic unique keys, and make mutable status a separately derived projection.
